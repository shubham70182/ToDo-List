<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Todo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top {
            margin-bottom: 20px;
        }

        .progress-counter {
            color: #4b5563;
            font-size: 16px;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: end;
        }

        .date-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #374151;
            font-size: 14px;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        #task-name {
            width: 280px;
        }

        .task-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .task-filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .task-tools input,
        .task-tools select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .filter-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
        }

        #add-btn {
            background: #2563eb;
            color: white;
        }

        #clear-btn {
            background: #ef4444;
            color: white;
        }

        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .column {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
        }

        .column h3 {
            margin-top: 0;
            color: #1f2937;
        }

        .task-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .overdue-task {
            background: #fef2f2;
            border-color: #ef4444;
        }

        .overdue-label {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 12px;
            font-weight: bold;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .task-name {
            font-weight: bold;
            color: #111827;
            cursor: pointer;
        }

        .task-date {
            color: #6b7280;
            font-size: 14px;
            margin-top: 6px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 6px 10px;
        }

        .empty {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <h1>Todo Board</h1>
            <p class="progress-counter" id="progress-counter">Progress: 0 of 0 tasks completed</p>
        </div>

        <!-- Add new task form -->
        <div class="form">
            <input id="task-name" type="text" placeholder="Task name">
            <label class="date-field" for="start-date">Start date
                <input id="start-date" type="date">
            </label>
            <label class="date-field" for="due-date">Due date
                <input id="due-date" type="date">
            </label>
            <button id="add-btn">Add Task</button>
            <button id="clear-btn">Clear Completed</button>
        </div>

        <div class="task-tools">
            <div class="task-filters" id="task-filters">
                <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
                <button class="filter-btn" data-filter="todo" aria-pressed="false">To Do</button>
                <button class="filter-btn" data-filter="done" aria-pressed="false">Done</button>
                <button class="filter-btn" data-filter="overdue" aria-pressed="false">Overdue</button>
            </div>
            <input id="search-tasks" type="search" placeholder="Search tasks or due dates">
            <select id="sort-tasks" aria-label="Sort tasks">
                <option value="default">Default order</option>
                <option value="due-asc">Due date (earliest first)</option>
                <option value="due-desc">Due date (latest first)</option>
                <option value="todo-first">To Do first</option>
                <option value="done-first">Done first</option>
            </select>
        </div>

        <!-- Kanban board -->
        <div class="board" id="task-board">
            <div class="column" id="todo-column">
                <h3>To Do</h3>
                <div id="todo-list"></div>
            </div>

            <div class="column" id="done-column">
                <h3>Done</h3>
                <div id="done-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
