<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Todo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top {
            margin-bottom: 20px;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: end;
        }

        .date-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #374151;
            font-size: 14px;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        #task-name {
            width: 280px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #add-btn {
            background: #2563eb;
            color: white;
        }

        #clear-btn {
            background: #ef4444;
            color: white;
        }

        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .column {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
        }

        .column h3 {
            margin-top: 0;
            color: #1f2937;
        }

        .task-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .task-name {
            font-weight: bold;
            color: #111827;
            cursor: pointer;
        }

        .task-date {
            color: #6b7280;
            font-size: 14px;
            margin-top: 6px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 6px 10px;
        }

        .empty {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <h1>Todo Board</h1>
        </div>

        <!-- Add new task form -->
        <div class="form">
            <input id="task-name" type="text" placeholder="Task name">
            <label class="date-field" for="start-date">Start date
                <input id="start-date" type="date">
            </label>
            <label class="date-field" for="due-date">Due date
                <input id="due-date" type="date">
            </label>
            <button id="add-btn">Add Task</button>
            <button id="clear-btn">Clear Completed</button>
        </div>

        <!-- Kanban board -->
        <div class="board">
            <div class="column">
                <h3>To Do</h3>
                <div id="todo-list"></div>
            </div>

            <div class="column">
                <h3>Done</h3>
                <div id="done-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
